name: CI

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: anf-rs/apps/frontend/package-lock.json

      - name: Build frontend
        working-directory: anf-rs/apps/frontend
        run: npm ci && npm run build

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anf-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('anf-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        working-directory: anf-rs
        run: cargo build --workspace

      - name: Test
        working-directory: anf-rs
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: anf-rs/apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: anf-rs/apps/frontend
        run: npm ci

      - name: Build
        working-directory: anf-rs/apps/frontend
        run: npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: anf-web
            tauri_artifact: anf-tauri
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: anf-web
            tauri_artifact: anf-tauri
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: anf-web.exe
            tauri_artifact: anf-tauri.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: anf-rs/apps/frontend/package-lock.json

      - name: Build frontend
        working-directory: anf-rs/apps/frontend
        run: npm ci && npm run build

      - name: Build release
        working-directory: anf-rs
        run: cargo build --release -p anf-web -p anf-tauri

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd anf-rs/target/release
          tar czf ../../../anf-web-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          tar czf ../../../anf-tauri-${{ matrix.target }}.tar.gz ${{ matrix.tauri_artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd anf-rs/target/release
          7z a ../../../anf-web-${{ matrix.target }}.zip ${{ matrix.artifact }}
          7z a ../../../anf-tauri-${{ matrix.target }}.zip ${{ matrix.tauri_artifact }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            anf-web-${{ matrix.target }}.*
            anf-tauri-${{ matrix.target }}.*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
