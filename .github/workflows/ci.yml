name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anf-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('anf-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        working-directory: anf-rs
        run: cargo build --workspace

      - name: Test
        working-directory: anf-rs
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: anf-rs/apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: anf-rs/apps/frontend
        run: npm ci

      - name: Type check
        working-directory: anf-rs/apps/frontend
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: anf-rs/apps/frontend
        run: npm run build
